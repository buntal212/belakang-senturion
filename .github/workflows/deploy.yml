name: Deploy SENTURION Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Runner: $(hostname)"
          php -v

      - name: Deploy source to production
        run: |
          TARGET="/www/wwwroot/api.senturion"

          rsync -av --delete \
            --exclude=".env" \
            --exclude=".git/" \
            --exclude=".htaccess" \
            --exclude=".user.ini" \
            --exclude="404.html" \
            --exclude="502.html" \
            --exclude="index.html" \
            --exclude="storage/" \
            "$GITHUB_WORKSPACE/" "$TARGET/"

      - name: Install Composer dependencies
        working-directory: /www/wwwroot/api.senturion
        run: |
          php -d open_basedir= /usr/bin/composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

      - name: Run database migrations
        working-directory: /www/wwwroot/api.senturion
        run: php artisan migrate --force

      - name: Optimize Laravel
        working-directory: /www/wwwroot/api.senturion
        run: |
          php artisan optimize:clear
          php artisan optimize

      - name: Fix writable directories
        working-directory: /www/wwwroot/api.senturion
        run: |
          chmod -R ug+rwX storage bootstrap/cache

      - name: Deployment completed
        run: |
          echo "SENTURION Backend deployment completed."
          php /www/wwwroot/api.senturion/artisan about
